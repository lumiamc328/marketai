<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MarketAI">
<title>MarketAI 股市儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080b12;--s1:#0d1018;--s2:#121620;--b1:#1e2436;--b2:#252d42;
  --green:#00e5a0;--blue:#4f8ef7;--red:#f24b6b;--gold:#f5b93f;--purple:#a78bfa;
  --t1:#e8edf8;--t2:#8a94b0;--t3:#454f6b;--r:13px;--r2:9px;
}
body{background:var(--bg);color:var(--t1);font-family:'Outfit',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.mono{font-family:'IBM Plex Mono',monospace;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--b1);border-radius:3px;}
.app{max-width:430px;margin:0 auto;padding-bottom:84px;min-height:100vh;}

/* Header */
.hdr{padding:20px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;z-index:60;background:linear-gradient(to bottom,var(--bg) 80%,transparent);}
.logo{font-size:21px;font-weight:900;letter-spacing:-1px;}
.logo em{color:var(--green);font-style:normal;}
.logo-sub{font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;display:flex;align-items:center;gap:5px;}
.live{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.hdr-right{text-align:right;}
.hdr-time{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-1px;}
.hdr-date{font-size:10px;color:var(--t3);margin-top:2px;}

/* Tabs */
.tabs{display:flex;gap:5px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 14px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.3px;cursor:pointer;border:1.5px solid var(--b1);background:transparent;color:var(--t3);font-family:'Outfit',sans-serif;transition:all .18s;white-space:nowrap;}
.tab.on{background:var(--green);color:var(--bg);border-color:var(--green);}

/* Section label */
.sl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);padding:0 16px 7px;margin-top:14px;}

/* Market grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 16px 6px;}
.mc{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:13px;position:relative;overflow:hidden;}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--stripe,var(--b1));}
.mc-lbl{font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;}
.mc-name{font-size:12px;font-weight:600;color:var(--t2);margin:3px 0 8px;}
.mc-price{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
.mc-chg{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:2px;}

/* Metric cards */
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 16px 6px;}
.metric-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:3px;}
.met-lbl{font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;}
.met-val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1;}
.met-label{font-size:11px;font-weight:700;margin-top:2px;}
.met-desc{font-size:10px;color:var(--t3);margin-top:2px;line-height:1.4;}

/* Sentiment bar */
.sbwrap{margin:0 16px 7px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:12px 14px;}
.sb-lbl{font-size:10px;color:var(--t2);font-weight:600;margin-bottom:7px;}
.sb-track{height:7px;background:var(--b1);border-radius:100px;overflow:hidden;display:flex;}
.sb-fill{height:100%;transition:width 1s ease;}
.sb-nums{display:flex;justify-content:space-between;margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;}

/* Stock cards */
.scard{margin:0 16px 7px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;}
.scard.hot{border-color:rgba(0,229,160,.2);background:rgba(0,229,160,.025);}
.sc-sym{font-size:15px;font-weight:800;letter-spacing:-.3px;}
.sc-name{font-size:11px;color:var(--t3);margin-top:1px;}
.sc-tags{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
.sc-tag{font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.05);color:var(--t3);}
.sc-tag.ai{background:rgba(0,229,160,.1);color:var(--green);}
.sc-tag.hot{background:rgba(245,185,63,.1);color:var(--gold);}
.sc-tag.watch{background:rgba(79,142,247,.1);color:var(--blue);}
.sc-tag.tw{background:rgba(167,139,250,.1);color:var(--purple);}
.sc-right{text-align:right;}
.sc-price{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}
.sc-chg{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:2px;}
.sc-note{font-size:10px;color:var(--t3);margin-top:3px;max-width:130px;line-height:1.4;}

/* Prev cards */
.pcard{margin:0 16px 7px;background:rgba(255,255,255,.02);border:1px dashed var(--b1);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;}
.pc-sym{font-size:14px;font-weight:800;}
.pc-name{font-size:10px;color:var(--t3);margin-top:1px;}
.pc-outcome{font-size:10px;margin-top:4px;}
.pc-right{text-align:right;}
.pc-chg{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
.pc-note{font-size:10px;color:var(--t3);margin-top:2px;max-width:120px;line-height:1.4;}

/* News */
.ncard{margin:0 16px 7px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:12px 14px;}
.n-meta{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.n-src{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;}
.n-dot{width:2px;height:2px;border-radius:50%;background:var(--b2);}
.n-time{font-size:9px;color:var(--t3);}
.n-sent{font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;margin-left:auto;}
.n-sent.bull{background:rgba(0,229,160,.1);color:var(--green);}
.n-sent.bear{background:rgba(242,75,107,.1);color:var(--red);}
.n-sent.neutral{background:rgba(255,255,255,.05);color:var(--t3);}
.n-impact{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:5px;background:rgba(245,185,63,.1);color:var(--gold);}
.n-title{font-size:13px;font-weight:600;line-height:1.5;}
.n-sum{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.5;}
.n-link{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:10px;font-weight:600;color:var(--blue);text-decoration:none;padding:4px 9px;border-radius:100px;border:1px solid rgba(79,142,247,.25);}

/* AI picks */
.mkt-toggle{display:flex;gap:5px;padding:0 16px 12px;} .mkt-btn.on-both{background:rgba(0,229,160,.12);border-color:rgba(0,229,160,.4);color:var(--green);}
.mkt-btn{flex:1;padding:9px;border-radius:var(--r2);border:1.5px solid var(--b1);background:transparent;color:var(--t3);font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;}
.mkt-btn.on-us{background:rgba(79,142,247,.12);border-color:rgba(79,142,247,.4);color:var(--blue);}
.mkt-btn.on-tw{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.4);color:var(--purple);}
.ai-section{margin:0 16px 8px;}
.ai-sec-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r) var(--r) 0 0;border:1px solid var(--b1);border-bottom:none;}
.ai-sec-icon{font-size:16px;}
.ai-sec-title{font-size:12px;font-weight:800;}
.ai-sec-badge{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:100px;margin-left:auto;}
.ai-picks{border:1px solid var(--b1);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden;}
.ai-pick{padding:12px 14px;border-bottom:1px solid var(--b1);display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;}
.ai-pick:last-child{border-bottom:none;}
.pick-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.pick-sym{font-size:14px;font-weight:800;}
.pick-name{font-size:11px;color:var(--t2);}
.pick-reason{font-size:12px;color:var(--t1);margin-top:6px;line-height:1.6;}
.pick-sub{font-size:11px;color:var(--t2);margin-top:4px;line-height:1.5;}
.pick-chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.pick-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;}
.pick-risk{font-size:9px;color:var(--red);margin-top:2px;}

.short-hdr{background:rgba(245,185,63,.05);}
.short-badge{background:rgba(245,185,63,.15);color:var(--gold);}
.short-num{background:rgba(245,185,63,.15);color:var(--gold);}
.short-chip{background:rgba(245,185,63,.1);color:var(--gold);}
.long-hdr{background:rgba(0,229,160,.05);}
.long-badge{background:rgba(0,229,160,.12);color:var(--green);}
.long-num{background:rgba(0,229,160,.12);color:var(--green);}
.long-chip{background:rgba(0,229,160,.08);color:var(--green);}
.exit-hdr{background:rgba(242,75,107,.05);}
.exit-badge{background:rgba(242,75,107,.12);color:var(--red);}
.exit-num{background:rgba(242,75,107,.12);color:var(--red);}
.exit-chip{background:rgba(242,75,107,.08);color:var(--red);}

/* Buttons */
.rbtn{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 16px 8px;padding:11px;width:calc(100% - 32px);background:var(--s1);border:1.5px solid var(--b1);border-radius:var(--r);color:var(--t3);font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.rbtn:hover{border-color:var(--green);color:var(--green);}
.rbtn:disabled{opacity:.4;cursor:not-allowed;}

/* Misc */
.err-box{margin:0 16px 8px;padding:11px 13px;background:rgba(242,75,107,.07);border:1px solid rgba(242,75,107,.2);border-radius:var(--r);font-size:12px;color:var(--red);line-height:1.5;}
.info-box{margin:0 16px 8px;padding:10px 13px;background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.15);border-radius:var(--r);font-size:11px;color:var(--t2);line-height:1.6;}
.skel{margin:0 16px 7px;border-radius:var(--r);background:var(--s1);border:1px solid var(--b1);overflow:hidden;position:relative;}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:shimmer 1.6s ease-in-out infinite;}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.div{height:1px;background:var(--b1);margin:6px 16px 12px;}
.ai-sum{margin:0 16px 10px;padding:10px 14px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);font-size:13px;font-weight:600;line-height:1.5;}
.ai-disc{margin:0 16px 8px;padding:10px 13px;background:rgba(255,255,255,.03);border:1px solid var(--b1);border-radius:var(--r);font-size:10px;color:var(--t3);line-height:1.6;}
.ai-loading{margin:16px;text-align:center;color:var(--t3);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:1;transform:scale(1.2);}}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pos{color:var(--green);}
.neg{color:var(--red);}
.neu{color:var(--t2);}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(12,14,22,.96);border-top:1px solid var(--b1);display:flex;padding:8px 0 20px;backdrop-filter:blur(20px);z-index:70;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--t3);cursor:pointer;background:none;border:none;font-family:'Outfit',sans-serif;padding:0;}
.nb.on{color:var(--green);}
.nb-i{font-size:17px;}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="hdr">
    <div>
      <div class="logo">Market<em>AI</em></div>
      <div class="logo-sub"><span class="live"></span><span id="status-txt">連線中...</span></div>
    </div>
    <div class="hdr-right">
      <div class="hdr-time mono" id="clock">--:--</div>
      <div class="hdr-date" id="dateTxt"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab on" onclick="switchTab('overview')">📊 大盤</button>
    <button class="tab" onclick="switchTab('watchlist')">⭐ 追蹤股</button>
    <button class="tab" onclick="switchTab('ai')">🤖 AI選股</button>
    <button class="tab" onclick="switchTab('news')">📰 新聞</button>
  </div>

  <!-- Error -->
  <div id="err-box" style="display:none" class="err-box"></div>

  <!-- Pages -->
  <div id="page-overview"></div>
  <div id="page-watchlist" style="display:none"></div>
  <div id="page-ai" style="display:none"></div>
  <div id="page-news" style="display:none"></div>

  <!-- Bottom nav -->
  <div class="bnav">
    <button class="nb on" onclick="switchTab('overview')"><span class="nb-i">📊</span>大盤</button>
    <button class="nb" onclick="switchTab('watchlist')"><span class="nb-i">⭐</span>追蹤股</button>
    <button class="nb" onclick="switchTab('ai')"><span class="nb-i">🤖</span>AI選股</button>
    <button class="nb" onclick="switchTab('news')"><span class="nb-i">📰</span>新聞</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  設定
// ═══════════════════════════════════════════
const GAS_URL = "https://script.google.com/macros/s/AKfycbydXjk3L1xb9_kV8-Ew3NpJzficeuyRrw-j1P4AKaZsDLZCAbtfYVgH7bTXN96p6PsE/exec";
const ANTHROPIC_API = "https://api.anthropic.com/v1/messages";

const US_META = {
  NVDA:  { tags:["AI","HOT"],   reason:"AI GPU 龍頭，Blackwell 出貨強勁" },
  TSLA:  { tags:["WATCH"],      reason:"監控歐洲銷量與自駕政策動向" },
  MSFT:  { tags:["AI"],         reason:"Azure AI 雲端高速成長" },
  META:  { tags:["AI","WATCH"], reason:"Llama 系列帶動廣告主信心" },
  AAPL:  { tags:["WATCH"],      reason:"iPhone 17 供應鏈動向追蹤" },
  AMD:   { tags:["AI"],         reason:"AI GPU 市占挑戰者" },
  GOOGL: { tags:["AI"],         reason:"I/O 大會後 AI 產品更新" },
  AMZN:  { tags:["WATCH"],      reason:"AWS 雲端季報持續追蹤" },
  SMCI:  { tags:["AI","HOT"],   reason:"AI 伺服器機殼供應商" },
  PLTR:  { tags:["AI"],         reason:"政府 AI 合約持續擴大" },
};
const TW_META = {
  "2330":{ tags:["AI","HOT","TW"], reason:"CoWoS 先進封裝訂單滿載" },
  "2317":{ tags:["HOT","TW"],      reason:"AI Server 機殼訂單成長" },
  "2454":{ tags:["AI","TW"],       reason:"AI 晶片設計能量受關注" },
  "2382":{ tags:["TW"],            reason:"散熱需求隨 AI 伺服器成長" },
  "3711":{ tags:["AI","TW"],       reason:"AI Edge 應用布局追蹤" },
  "2308":{ tags:["TW","WATCH"],    reason:"電源供應 AI Server 受惠" },
  "2412":{ tags:["TW"],            reason:"電信基礎建設穩定配息" },
  "2303":{ tags:["TW","WATCH"],    reason:"晶圓代工受惠 AI 需求" },
};
const PREV_SAMPLE = [
  { symbol:"AAPL",  name:"Apple Inc",      result:"+1.89%", raw:1.89,  note:"iPhone 17 備貨消息帶動" },
  { symbol:"AMD",   name:"Advanced Micro", result:"-0.73%", raw:-0.73, note:"AI GPU 市占壓力" },
  { symbol:"2317",  name:"鴻海",           result:"+3.42%", raw:3.42,  note:"AI Server 機殼訂單成長" },
  { symbol:"GOOGL", name:"Alphabet",       result:"+0.55%", raw:0.55,  note:"I/O 大會新品帶動情緒" },
];

// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
let state = {
  tab: "overview",
  mkt: "TW",
  data: null,
  loading: false,
  aiData: { US: null, TW: null, BOTH: null },
  aiLoad: { US: false, TW: false, BOTH: false },
  aiDone: { US: false, TW: false, BOTH: false },
  aiErr:  { US: "", TW: "", BOTH: "" },
};

// ═══════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════
const clr = r => r > 0 ? "pos" : r < 0 ? "neg" : "neu";
const stripe = r => r > 0 ? "var(--green)" : r < 0 ? "var(--red)" : "var(--b1)";
const pct = (v, plus=true) => v == null ? "--" : (plus && v > 0 ? "+" : "") + Number(v).toFixed(2) + "%";
const timeAgo = ts => {
  if (!ts) return "";
  const m = Math.floor((Date.now()/1000 - ts) / 60);
  if (m < 1) return "剛剛";
  if (m < 60) return m + "分前";
  if (m < 1440) return Math.floor(m/60) + "小時前";
  return Math.floor(m/1440) + "天前";
};
const tagCls = t => {
  const v = t.toLowerCase();
  return v==="ai"?"ai":v==="hot"?"hot":v==="watch"?"watch":v==="tw"?"tw":"";
};
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// Clock
function updateClock() {
  const now = new Date();
  const days = ["日","一","二","三","四","五","六"];
  document.getElementById("clock").textContent =
    String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  document.getElementById("dateTxt").textContent =
    (now.getMonth()+1) + "/" + now.getDate() + " 週" + days[now.getDay()];
}
updateClock();
setInterval(updateClock, 30000);

// Tab switching
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach((el,i) => {
    el.classList.toggle("on", ["overview","watchlist","ai","news"][i] === tab);
  });
  document.querySelectorAll(".nb").forEach((el,i) => {
    el.classList.toggle("on", ["overview","watchlist","ai","news"][i] === tab);
  });
  ["overview","watchlist","ai","news"].forEach(t => {
    document.getElementById("page-"+t).style.display = t===tab ? "" : "none";
  });
  if (tab === "ai") renderAI();
}

// Error display
function showErr(msg) {
  const el = document.getElementById("err-box");
  if (msg) { el.textContent = "⚠️ " + msg; el.style.display = ""; }
  else { el.style.display = "none"; }
}

// ═══════════════════════════════════════════
//  JSONP Fetch (bypasses CORS on GAS redirect)
// ═══════════════════════════════════════════
function fetchJSONP(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      cleanup(); reject(new Error("Timeout"));
    }, 25000);
    function cleanup() {
      delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    window[cb] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("載入失敗，請確認 GAS 已部署")); };
    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.head.appendChild(script);
  });
}

async function fetchData() {
  if (state.loading) return;
  state.loading = true;
  document.getElementById("status-txt").textContent = "更新中...";
  showErr("");
  renderSkeletons();
  try {
    const json = await fetchJSONP(GAS_URL + "?action=all");
    if (json.error) throw new Error(json.error);
    state.data = json;
    const now = new Date();
    document.getElementById("status-txt").textContent =
      String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0") + " 更新";
    renderAll();
  } catch(e) {
    showErr(e.message);
    document.getElementById("status-txt").textContent = "連線失敗";
    renderAll(); // show fallback
  } finally {
    state.loading = false;
  }
}

// Auto refresh every 5 min

  const usStocks = (d.us_stocks||[]).filter(s=>!s.error);

  const lines = [
    ...Object.values(mkts.us||{}).map(m=>`${m.name} ${m.price} (${m.changePercent>0?"+":""}${m.changePercent}%)`),
    mkts.tw?.TWII ? `台股加權 ${mkts.tw.TWII.price} (${mkts.tw.TWII.changePercent}%)` : "",
    mkts.fx?.USDTWD ? `USD/TWD ${mkts.fx.USDTWD.price}` : "",

    fg.value!=null ? `恐懼貪婪指數 ${fg.value}（${fg.label}）` : "",

  return { summary: lines.join(" | "), usList, twList };
}

async function fetchAI(market) {
  const key = market;
  if (state.aiDone[key]) return;
  state.aiLoad[key] = true;
  renderAIPage();

  try {
    // Route through GAS proxy to avoid CORS and enable web_search tool
    const json = await fetchJSONP(GAS_URL + "?action=ai_picks&market=" + encodeURIComponent(market)
      + "&prompt=" + encodeURIComponent(buildUserPrompt(market)));
    if (json.error) throw new Error(json.error);
    const raw = json.result || "";
    const clean = raw.replace(/```json|```/g,"").trim();
    const match = clean.match(/\{[\s\S]*\}/);
    if (!match) throw new Error("AI 回傳格式錯誤，請重試");
    const parsed = JSON.parse(match[0]);
    state.aiData[key] = parsed;
    state.aiDone[key] = true;
  } catch(e) {
    state.aiErr[key] = "分析失敗：" + e.message;
    console.error("AI error:", e);
  } finally {
    state.aiLoad[key] = false;
    renderAIPage();
  }
}

  document.getElementById("page-ai").innerHTML =
    toggle + body + regenBtn +
    `<div class="ai-disc">⚠️ AI 根據即時網路搜尋給出建議，僅供參考，不構成投資建議。投資有風險，請自行評估並設好停損。</div>`;
}

function renderAI() {
  renderAIPage();
  const mkt = state.mkt;
  if (!state.aiDone[mkt] && !state.aiLoad[mkt]) fetchAI(mkt);
}

window.setMkt = function(mkt) {
  state.mkt = mkt;
  renderAI();
};
window.regenAI = function() {
  const mkt = state.mkt;
  state.aiDone[mkt] = false;
  state.aiData[mkt] = null;
  state.aiErr[mkt] = "";
  fetchAI(mkt);
};

// ═══════════════════════════════════════════
//  Render all
// ═══════════════════════════════════════════
function renderAll() {
  renderOverview();
  renderWatchlist();
  renderNews();
  if (state.tab === "ai") renderAIPage();
}

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
renderSkeletons();
renderAll();
fetchData();
</script>
</body>
</html>
